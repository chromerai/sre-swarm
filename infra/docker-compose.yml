services:
  postgres:
    image: postgres:16.14-alpine3.24
    container_name: local_postgres
    restart: always
    mem_limit: 1g
    cpus: 1.0
    shm_size: 128m
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sre-net
    
  nats:
    image: nats:2.14.2-alpine3.22
    container_name: local_nats
    restart: always
    mem_limit: 256m
    cpus: 0.5
    command: [
      "-js", 
      "--store_dir", "/data", 
      "--port","4222",
      "--http_port","8222",
      "--name","sre-nats",
      ]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sre-net

volumes:
  pgdata:
    driver: local
  natsdata:
    driver: local

networks:
  sre-net:
    driver: bridge